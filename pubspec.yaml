flutter_icons:
   image_path: "assets/images/appIcon.png"
   android: true
   ios: true


  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - lib/core/localization/language/
    
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # Uni Neue (licensed, purchased family - see assets/fonts/UniNeue/).
  # Weights are the usWeightClass values embedded in each file (checked with
  # fonttools), not a guess from the file name: Thin=250->100, Light=300,
  # Book=400, Regular=500, Bold=700, Heavy=800, Black=900. AyurezeTheme.font()
  # only ever asks for w500/w700/w800, so Regular/Bold/Heavy cover every style
  # the app actually uses; the rest are here for completeness.
  fonts:
    - family: Uni Neue
      fonts:
        - asset: assets/fonts/UniNeue/UniNeue-Thin.ttf
          weight: 100
        - asset: assets/fonts/UniNeue/UniNeue-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/UniNeue/UniNeue-Light.ttf
          weight: 300
        - asset: assets/fonts/UniNeue/UniNeue-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/UniNeue/UniNeue-Book.ttf
          weight: 400
        - asset: assets/fonts/UniNeue/UniNeue-BookItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/UniNeue/UniNeue-Regular.ttf
          weight: 500
        - asset: assets/fonts/UniNeue/UniNeue-RegularItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/UniNeue/UniNeue-Bold.ttf
          weight: 700
        - asset: assets/fonts/UniNeue/UniNeue-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/UniNeue/UniNeue-Heavy.ttf
          weight: 800
        - asset: assets/fonts/UniNeue/UniNeue-HeavyItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/UniNeue/UniNeue-Black.ttf
          weight: 900
        - asset: assets/fonts/UniNeue/UniNeue-BlackItalic.ttf
          weight: 900
          style: italic
